projects:
  - title: University Dissertation - Researching the Effects of Batch Size and Window Size in SWIN-Transformer GANs
    categories:
      - machine learning
      - assessment
    description: >
      With the recent interest in transformers and image generation, the need to test novel methods arises.
      This paper investigates how window size and batch size affects SwinTranformer GAN image quality.
      All models had the same number of parameters - 10M for the generator, and 1.7M for the discrimintor.
      The size difference between the generator and discriminator is because the generator uses transformers whereas the discriminator uses a simpler DCGAN.
      After testing nine different models, the best was found to have a window size of 8 and a batch size of 100 (FID score of 88.4).
      The worst was found to have a window size of 8 and batch size of 200 (FID score of 180.6).
      Future investigation could be undertaken to study the effects of learning rate, attention head count, and transformer layer count.
      Switching to use a Wasserstein discriminator could also beneficial as it could suppress the mode collapse issues encounted during training.
    images:
      - https://raw.githubusercontent.com/MightyElemental/swintransgan-faces/master/imgs/BestManualSelected.png
      - /projects/dissertation/progression.png
    links:
      - label: View on GitHub
        url: https://github.com/MightyElemental/swintransgan-faces
      - label: Read the Paper
        url: https://github.com/MightyElemental/swintransgan-faces/blob/master/Generating%20Images%20Using%20Generative%20Deep%20Learning.pdf

