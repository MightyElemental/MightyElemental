  - title: Reactor Optimizer
    categories:
      - tool
    description: >
      A script designed to find the optimal reactor control rod position for best reactor efficiency.
      Once the optimal level has been found, this script will attempt to manage the reactor to stay at the optimal level.
      It will automatically extract the rods if energy demand is higher than current power generation,
      then will try to find an equilibrium. Once the power demand reduces, the script will return to optimal rod insertion.
    images:
      - /projects/reactor-optimizer/efficiency.png
    links:
      - label: View on GitHub
        url: https://github.com/MightyElemental/ReactorOptimizer

  - title: A-Level Assessment - Xendos
    categories:
      - tool
      - assessment
    description: >
      Created as part of my A-Level course in Computer Science, this is a simulated operating system
      that has a custom window manager and an extensible software system. Windows can be dragged,
      stacked, hidden, and unhidden. Additional software can be loaded directly from packaged jar
      files without needing to recompile Xendos. The Xendos development library has multiple UI
      elements to construct applications with.
