<!DOCTYPE html>
<html lang="en">

	{% include head.html %}
	
	<body>
		<header>
			<div class="container">
				<a id="a-title" href="{{ '/' | relative_url }}">
					<h1>{{ site.title | default: site.github.repository_name }}</h1>
				</a>
				<h2>{{ site.description }}</h2>
				{% include navigation.html %}
			</div>
		</header>
	
		<div class="container">
			<section id="main_content">
				{{ content }}
			</section>
		</div>
	</body>
</html>
